services:
  mongodb:
    image: mongo:7.0
    container_name: inverfit-stack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-inverfit_container}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-inverfit_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-inverfit_container}
    volumes:
      - inverfit-stack-mongo-data:/data/db
      - ./docker/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    # NOTA: Para depuración externa se puede mapear temporalmente un puerto libre (ej. "127.0.0.1:27018:27017"),
    # pero por defecto no se publica ningún puerto para evitar colisiones con el MongoDB de desarrollo local (27017).
    networks:
      - inverfit-stack-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mongosh --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inverfit-stack-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: ${HTTP_PORT:-8080}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-inverfit_container}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - inverfit-stack-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -f http://localhost:8080/health/ready || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  inverfit-stack-net:
    name: inverfit-stack-net
    driver: bridge

volumes:
  inverfit-stack-mongo-data:
    name: inverfit-stack-mongo-data
